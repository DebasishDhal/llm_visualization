name: Sync to Hugging Face hub

on:
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://DebasishDhal99:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          git push --force https://huggingface.co/spaces/DebasishDhal99/LLM-Visualization main
